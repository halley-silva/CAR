<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAR</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&family=Fascinate&family=Jersey+10&family=Pixelify+Sans:wght@400..700&family=Pompiere&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="tela" id="home">
        <div class="pai_todos">
            <div class="cabeçalho">
                <img src="../../assets/do-utilizador.png" width="30px">
                <div class="ola">
                    <p id="paragrafo_ola">Ola Cometa</p>
                </div>
            </div>

            <div class="meu_carro">
                <div class="titulo_meuCarro">
                    <h2>Meu carro</h2>
                </div>
                <div class="quadrado_carro">
                    <div class="carro">
                        <img src="../../assets/BMW M3 GTR.png" width="300px">

                    </div>
                    <div class="informações_carro">
                        <div class="nome_ano">
                            <p class="texto_carro">2005</p>
                            <p class="texto_carro">BMW M3 GTR </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="tela" id="wify">
        <div class="pai_wifi">
            <h2>COnfigurar</h2>
        </div>
    </div>

    <div class="menu_navegação">
        <div class="botões">
            <button class="btn" content-id="home">
                HOME

            </button>

            <button class="btn" content-id="wify">
                CONEXÃO
            </button>
        </div>




    </div>

</body>
<script src="script.js"></script>


</html>
